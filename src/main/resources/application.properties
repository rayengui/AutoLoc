spring.application.name=MohamedRayenGuissouma
spring.profiles.active=dev

# Serveur : toutes les URL de l'API commencent par /api
server.port=8080
server.servlet.context-path=/api

# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_assoc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JSON : accepter une reference par id seul (ex. "contrat": {"idContrat": 1})
# meme si l'entite referencee a un attribut primitif (boolean valide)
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.mohamedrayenguissouma=INFO